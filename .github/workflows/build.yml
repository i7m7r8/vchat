name: Vchat CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Single version of the NDK used everywhere (kept in sync with fdroid recipe).
  ANDROID_NDK_VERSION: "27.0.12077973"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Typecheck frontend
        run: npx tsc --noEmit
      - name: Build frontend
        run: npx vite build
      - name: Format code
        run: cargo fmt --all
        working-directory: src-tauri
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri
      - name: Run tests
        run: cargo test --all
        working-directory: src-tauri

  build-linux:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: vchat-linux-x86_64
          path: src-tauri/target/release/bundle/**/*
          retention-days: 30

  build-windows:
    needs: lint-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: vchat-windows-x86_64
          path: src-tauri/target/release/bundle/**/*
          retention-days: 30

  build-macos:
    needs: lint-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tauri build --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: vchat-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/**/*
          retention-days: 30

  build-android:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prepare Android project (deterministic manifest + versioning)
        run: bash scripts/android-prepare.sh
      - name: Build universal APK
        run: npx tauri android build --target universal --apk
      - name: Inspect build output
        run: ls -la src-tauri/gen/android/app/build/outputs/apk/universal/release/ 2>/dev/null || ls -R src-tauri/gen/android/app/build/outputs/apk/ | head -40
      - name: Sign release APK (requires keystore secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret configured; leaving APK debug-signed."
            exit 0
          fi
          SB="$ANDROID_HOME/build-tools"
          BT=$(ls "$SB" | sort -V | tail -1)
          APKSIGNER="$SB/$BT/apksigner"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
          APK=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          cp "$APK" "$APK.unsigned.apk"
          "$APKSIGNER" sign --ks keystore.jks --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEYSTORE_ALIAS" --key-pass "pass:$ANDROID_KEYSTORE_KEY_PASSWORD" "$APK"
          rm -f keystore.jks
      - name: Upload universal APK (+ unsigned copy for F-Droid reproducibility)
        uses: actions/upload-artifact@v4
        with:
          name: vchat-android-universal
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          retention-days: 30

  fdroid-check:
    if: github.event_name == 'push'
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate F-Droid metadata
        run: |
          docker run --rm --entrypoint bash -e LC_ALL=C.UTF-8 -v "$PWD":/tmp/work \
            registry.gitlab.com/fdroid/fdroidserver:latest -lc '
            set -e
            cd /tmp/work
            mkdir -p /tmp/buildfdroid && cd /tmp/buildfdroid
            fdroid init --quiet --repo-address https://example.invalid/fdroid >/dev/null
            cp /tmp/work/fdroid/org.vchat.messenger.yml metadata/
            fdroid lint --no-fail org.vchat.messenger
          '

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          shopt -s globstar
          # Keep the F-Droid-friendly name stable for the Binaries: link
          for apk in artifacts/vchat-android-universal/**/*.apk; do
            if [[ "$apk" != *unsigned* ]]; then
              cp "$apk" "vchat-android-universal.apk"
            else
              cp "$apk" "vchat-android-universal-unsigned.apk"
            fi
          done
          ls -la
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*
            vchat-android-universal.apk
            vchat-android-universal-unsigned.apk