<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vchat</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div class="sidebar">
      <div class="sidebar-header">
        <h1>Vchat</h1>
        <div class="onion-address" id="onion-address">Connecting to Tor...</div>
      </div>
      <div class="sidebar-actions">
        <button id="btn-add-contact" class="btn-icon" title="Add Contact">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </button>
        <button id="btn-settings" class="btn-icon" title="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
          </svg>
        </button>
      </div>
      <div class="contacts-list" id="contacts-list"></div>
    </div>
    <div class="chat-area">
      <div class="chat-header" id="chat-header">
        <div class="chat-info">
          <div class="chat-name" id="chat-name">Select a conversation</div>
          <div class="chat-status" id="chat-status"></div>
        </div>
        <div class="chat-actions">
          <button id="btn-video-call" class="btn-icon" title="Video Call" disabled>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
            </svg>
          </button>
          <button id="btn-screen-share" class="btn-icon" title="Screen Share" disabled>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="messages-container" id="messages-container">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" width="64" height="64" fill="#666">
            <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
          </svg>
          <p>Select a contact to start messaging</p>
        </div>
      </div>
      <div class="message-input-area" id="message-input-area" style="display: none;">
        <div class="message-input-wrapper">
          <textarea id="message-input" placeholder="Type a message..." rows="1"></textarea>
          <button id="btn-send" class="btn-send" title="Send">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div class="video-panel" id="video-panel" style="display: none;">
      <div class="video-container">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
      </div>
      <div class="video-controls">
        <button id="btn-toggle-video" class="btn-video-control" title="Toggle Video">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
          </svg>
        </button>
        <button id="btn-toggle-audio" class="btn-video-control" title="Toggle Audio">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
          </svg>
        </button>
        <button id="btn-end-call" class="btn-video-control btn-end-call" title="End Call">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="modal" id="add-contact-modal" style="display: none;">
    <div class="modal-content">
      <h2>Add Contact</h2>
      <div class="form-group">
        <label for="contact-name">Display Name</label>
        <input type="text" id="contact-name" placeholder="Enter display name" />
      </div>
      <div class="form-group">
        <label for="contact-onion">Onion Address</label>
        <input type="text" id="contact-onion" placeholder="xxxxxxxxxxxxxxxx.onion" />
      </div>
      <div class="form-group">
        <label for="contact-key">Public Key</label>
        <input type="text" id="contact-key" placeholder="Public key hex" />
      </div>
      <div class="modal-actions">
        <button id="btn-cancel-contact" class="btn-secondary">Cancel</button>
        <button id="btn-save-contact" class="btn-primary">Add Contact</button>
      </div>
    </div>
  </div>

  <div class="modal" id="qr-modal" style="display: none;">
    <div class="modal-content">
      <h2>Your QR Code</h2>
      <div class="qr-container" id="qr-container"></div>
      <p class="qr-instruction">Share this QR code with others to add you as a contact</p>
      <div class="modal-actions">
        <button id="btn-close-qr" class="btn-secondary">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
