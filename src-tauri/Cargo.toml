[package]
name = "vchat"
version = "2.0.0"
edition = "2021"
description = "Fully-featured P2P encrypted messenger with Tor, E2E encryption, video calls, file sharing, groups, and screen sharing - no servers, no hosting"
authors = ["Vchat Contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/i7m7r8/vchat"
rust-version = "1.91"

[lib]
name = "vchat_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Classical Cryptography ──────────────────────────────────────────────────
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
sha3 = "0.10"
snow = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
hex = "0.4"

# ── SRTP media security (RFC 3711): AES-CTR + HMAC-SHA1 ─────────────────────
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
sha1 = "0.10"

# ── Post-Quantum Cryptography (NIST PQC, hybrid, optional) ─────────────────
pqc_kyber = { version = "0.7", optional = true, features = ["kyber768"] }
pqc_dilithium = { version = "0.2", optional = true, features = ["mode3"] }
pqc_sphincsplus = { version = "0.2", optional = true, features = ["shake"] }

# ── Async runtime ───────────────────────────────────────────────────────────
futures = "0.3"
tokio = { version = "1", features = ["full"] }

# ── Logging / Auditing ──────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Storage ─────────────────────────────────────────────────────────────────
rusqlite = { version = "0.36", features = ["bundled"] }

# ── Error handling ──────────────────────────────────────────────────────────
thiserror = "1"
anyhow = "1"

# ── QR code generation ──────────────────────────────────────────────────────
qrcode = "0.14"

# ── Misc ────────────────────────────────────────────────────────────────────
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
url = "2"
bincode = "1"
dirs = "5"
local-ip-address = "0.5"

# ── Embedded Tor (serverless transport), pure-Rust Arti ────────────────────
arti-client = { version = "0.45", features = ["onion-service-service"] }
tor-rtcompat = { version = "0.45", default-features = false, features = ["tokio"] }
tor-llcrypto = { version = "0.45" }
tor-config = { version = "0.45" }

# ── Async trait helpers ─────────────────────────────────────────────────────
async-trait = "0.1"

# ── Jami-style P2P networking (real crates) ─────────────────────────────────
# OpenDHT is a C++ library; its Rust binding requires the native lib. It is
# kept behind an off-by-default feature so the default build (Tor transport)
# stays buildable on minimal toolchains and in CI without native C++ deps.
# STUN/ICE is hand-rolled in webrtc::ice (no external `stun` crate needed),
# avoiding the ring 0.13/0.16 conflict between OpenDHT and the TLS stack.
opendht = { version = "0.5", optional = true, default-features = false }
mime_guess = "2"

# ── TLS (used by the secure Tor control channel) ───────────────────────────
rustls = { version = "0.23", features = ["std", "tls12", "ring"] }

# ── Native, heavyweight Jami media/swarm deps (opt-in) ─────────────────────
rcgen = { version = "0.13", optional = true }
srtp = { version = "0.7", optional = true }
opus = { version = "0.3", optional = true }
git2 = { version = "0.19", optional = true, default-features = false }
tokio-rustls = { version = "0.26", optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", features = ["invocation"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "fs"] }

[features]
default = ["custom-protocol", "pqc-hybrid"]
custom-protocol = ["tauri/custom-protocol"]

# Post-Quantum Cryptography Features
pqc-kyber = ["dep:pqc_kyber"]
pqc-dilithium = ["dep:pqc_dilithium"]
pqc-sphincs = ["dep:pqc_sphincsplus"]
pqc-hybrid = ["pqc-kyber", "pqc-dilithium"]

# Jami-style P2P (opt-in, heavy native deps) - not default
jami-p2p = ["dep:opendht", "dep:rcgen", "dep:srtp", "dep:opus", "dep:git2", "dep:tokio-rustls"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
overflow-checks = true
