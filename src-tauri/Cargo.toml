[package]
name = "vchat"
version = "1.0.0"
edition = "2021"
description = "Military-grade encrypted P2P messenger with Tor, E2E encryption, video calls, and screen sharing"
authors = ["Vchat Contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/i7m7r8/vchat"
rust-version = "1.75"

[lib]
name = "vchat_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Cryptography (military-grade) ──────────────────────────────
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["std"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
snow = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"

# ── Async runtime ──────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# ── Logging / Auditing ────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Storage ────────────────────────────────────────────────────
rusqlite = { version = "0.31", features = ["bundled"] }

# ── Error handling ─────────────────────────────────────────────
thiserror = "1"
anyhow = "1"

# ── QR code generation ────────────────────────────────────────
qrcode = "0.14"

# ── Misc ──────────────────────────────────────────────────────
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
once_cell = "1"
dirs = "5"
hex = "0.4"
url = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", features = ["invocation"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
overflow-checks = true
