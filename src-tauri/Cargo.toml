[package]
name = "vchat"
version = "0.1.0"
edition = "2021"
description = "Ultra-secure P2P Tor-based messaging, video calling, and screen sharing"
authors = ["Vchat Contributors"]
license = "MIT"
repository = "https://github.com/i7m7r8/vchat"

[lib]
name = "vchat_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cryptography
snow = "0.10"
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
sha2 = "0.10"
hkdf = "0.12"
hex = "0.4"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Error handling
thiserror = "1"
anyhow = "1"

# UUID for peer identification
uuid = { version = "1", features = ["v4"] }

# base32 - we encode manually to avoid broken crate

# Chrono for timestamps
chrono = "0.4"

# Once cell for statics
once_cell = "1"

# Dir paths
dirs = "5"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", features = ["invocation"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
